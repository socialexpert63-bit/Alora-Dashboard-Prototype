const nx=()=>{if(!pP&&pI==i)step(i+1)};
if(SC[i][0]=='ci')setTimeout(()=>{if(pI==i){const a=S.at.find(x=>!x.in);if(a)ck(a.id)}},3500);
if(SC[i][0]=='crm')setTimeout(()=>{if(pI==i){const l=S.ld.find(x=>x.st<3);if(l){l.st++;toast('Lead moved to '+S.stages[l.st]);render()}}},4500);
try{const u=new SpeechSynthesisUtterance(SC[i][1]);u.rate=.95;const v=speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang)&&/(Samantha|Google US|Aria|Jenny|Natural)/i.test(v.name));if(v)u.voice=v;u.onend=nx;speechSynthesis.speak(u)}catch(e){}
pT=setTimeout(nx,SC[i][1].length*95+1500)}
function demo(){stopDemo();pE=document.createElement('div');pE.id='pl';pE.innerHTML='<div class="pb"><i></i></div><span class="pt"></span><div class="pcb"><button data-p="pp">Pause</button><button data-p="nx">Next</button><button data-p="x">Close</button><span></span></div>';document.body.append(pE);document.body.classList.add('pp');
pE.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.p=='x')stopDemo();else if(b.dataset.p=='nx')step(pI<0?0:pI+1);else if(pP)step(pI);else{pP=true;clearTimeout(pT);try{speechSynthesis.cancel()}catch(e){}b.textContent='Resume'}};step(0)}
const LV=['Omar Siddiqui checked in','New registration: Tomas Reyes','Lead qualified: Aisha Karim','Meeting confirmed: Atlas Group','Email campaign opened by 42 recipients','Sara Al Mansoori checked in'];let li=0;
setInterval(()=>{const t=document.querySelector('.tl');if(!t||S.view!='ov')return;const p=document.createElement('p');p.className='nw';p.innerHTML=LV[li++%LV.length]+'<small>just now</small>';t.prepend(p);while(t.children.length>5)t.lastChild.remove()},4500);
</script></body></html>
